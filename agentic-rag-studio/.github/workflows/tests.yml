name: Papertrail tests
on:
  push:
    paths: ['agentic-rag-studio/**']
  pull_request:
    paths: ['agentic-rag-studio/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pypdf
      - working-directory: agentic-rag-studio
        run: python -m pytest tests -q
