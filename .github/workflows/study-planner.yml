name: Study planner tests

on:
  push:
    paths:
      - 'day-03-ai-agent/**'
      - '.github/workflows/study-planner.yml'
  pull_request:
    paths:
      - 'day-03-ai-agent/**'
      - '.github/workflows/study-planner.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: day-03-ai-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r day-03-ai-agent/requirements.txt
      - name: Run tool, controller, SDK, and interface tests
        run: python -m unittest discover -s day-03-ai-agent -p 'test_*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q day-03-ai-agent
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
