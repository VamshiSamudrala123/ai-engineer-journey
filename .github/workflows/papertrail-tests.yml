name: Papertrail core tests
on:
  push:
    paths:
      - 'agentic-rag-studio/**'
      - '.github/workflows/papertrail-tests.yml'
  pull_request:
    paths:
      - 'agentic-rag-studio/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pypdf
      - name: Run core tests
        working-directory: agentic-rag-studio
        run: python -m pytest tests -q
