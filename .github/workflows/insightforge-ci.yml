name: InsightForge CI

on:
  push:
    branches:
      - main
    paths:
      - 'day-04-insightforge-agent/**'
      - '.github/workflows/insightforge-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'day-04-insightforge-agent/**'
      - '.github/workflows/insightforge-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: day-04-insightforge-agent/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r day-04-insightforge-agent/requirements.txt

      - name: Run InsightForge tests
        run: python -m unittest discover -s day-04-insightforge-agent/tests -q

      - name: Check Python syntax
        run: python -m compileall -q day-04-insightforge-agent

  react-build:
    name: React Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: day-04-insightforge-agent/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: day-04-insightforge-agent/dashboard/package-lock.json

      - name: Install React dependencies
        run: npm ci

      - name: Build React dashboard
        run: npm run build
